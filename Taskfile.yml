version: '3'

vars:
  PROJECT_ROOT:
    sh: pwd
  GOBIN: '{{.PROJECT_ROOT}}/bin'
  GOLANGCI_LINT_LOCAL_BINARY: '{{.GOBIN}}/golangci-lint{{exeExt}}'
  REQUIRED_GOLANGCI_LINT_VERSION:
    sh: cat .golangci.version 2>/dev/null || echo "2.13.1"
  GOLANGCI_LINT_BINARY:
    sh: |
      required="$(cat .golangci.version 2>/dev/null || echo "2.13.1")"
      matches_required() {
        [ -x "$1" ] || return 1
        [ "$("$1" version --short 2>/dev/null || true)" = "$required" ]
      }
      old_ifs="$IFS"
      IFS=:
      for dir in $PATH; do
        [ -n "$dir" ] || dir=.
        candidate="$dir/golangci-lint{{exeExt}}"
        if matches_required "$candidate"; then
          echo "$candidate"
          exit 0
        fi
      done
      IFS="$old_ifs"
      if matches_required "{{.GOLANGCI_LINT_LOCAL_BINARY}}"; then
        echo "{{.GOLANGCI_LINT_LOCAL_BINARY}}"
        exit 0
      fi
      echo "{{.GOLANGCI_LINT_LOCAL_BINARY}}"
  GOLANGCI_LINT_VERSION:
    sh: |
      "{{.GOLANGCI_LINT_BINARY}}" version --short 2>/dev/null ||
      echo "not-installed"

env:
  GOBIN: '{{.GOBIN}}'

tasks:
  default:
    desc: Run lint and test
    cmds:
      - task: lint
      - task: test

  help:
    desc: Show this help message
    cmds:
      - echo "go-time"
      - echo "Available targets:"
      - task --list
    silent: true

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf {{.GOBIN}}
      - go clean -cache -testcache || true

  deps:
    desc: Download Go module dependencies
    cmds:
      - echo "Downloading dependencies..."
      - go mod download

  deps:update:
    desc: Update dependencies for the root module and any nested modules
    cmds:
      - |
        set -e
        echo "Updating dependencies..."
        MODULES=". $(find . -mindepth 2 -name go.mod \
          -not -path '*/vendor/*' -not -path '*/.*' \
          -exec dirname {} \; | sort)"
        for dir in $MODULES; do
          echo "==> $dir"
          (
            cd "$dir"
            replaced=$(awk '
              /^replace[[:space:]]+[^(]/ { print $2 }
              /^replace[[:space:]]*\(/ { f=1; next }
              f && /^\)/ { f=0; next }
              f && /=>/ { print $1 }
            ' go.mod)
            deps=$(awk '
              /^require[[:space:]]+[^(]/ { print $2 }
              /^require[[:space:]]*\(/ { f=1; next }
              f && /^\)/ { f=0; next }
              f && !/\/\/ indirect/ && NF >= 2 { print $1 }
            ' go.mod | while read -r dep; do
              echo "$replaced" | grep -qxF "$dep" || echo "$dep"
            done | tr '\n' ' ')
            if [ -n "$deps" ]; then
              go get -u $deps
            fi
            go mod tidy
          )
        done
        if [ -f go.work ]; then
          echo "==> go work sync"
          go work sync
        fi

  test:
    desc: Run all tests with race detection
    cmds:
      - echo "Running all tests..."
      - go test -race -count=1 ./...

  lint:
    desc: Run all linters
    cmds:
      - task: tidy-lint
      - task: fmt-check
      - task: vet
      - task: golangci-lint

  install-golangci-lint:
    desc: Install golangci-lint with the required version
    cmds:
      - mkdir -p "{{.GOBIN}}"
      - |
        if [ "{{.GOLANGCI_LINT_VERSION}}" != "{{.REQUIRED_GOLANGCI_LINT_VERSION}}" ]; then
          echo "Installing golangci-lint v{{.REQUIRED_GOLANGCI_LINT_VERSION}}..."
          GOWORK=off GOBIN="{{.GOBIN}}" go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v{{.REQUIRED_GOLANGCI_LINT_VERSION}}
        fi
    status:
      - test "{{.GOLANGCI_LINT_VERSION}}" = "{{.REQUIRED_GOLANGCI_LINT_VERSION}}"

  golangci-lint:
    desc: Run golangci-lint
    deps:
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT_BINARY}} version'
      - echo "Running golangci-lint..."
      - '{{.GOLANGCI_LINT_BINARY}} run --allow-serial-runners --timeout=30m --concurrency=1 --path-prefix=. ./...'

  tidy-lint:
    desc: Check module files without changing them
    cmds:
      - echo "Checking go.mod and go.sum are tidy..."
      - go mod tidy -diff

  yamllint:
    desc: Run yamllint
    cmds:
      - yamllint -s .

  vuln:
    desc: Run govulncheck
    cmds:
      - govulncheck ./...

  fmt:
    desc: Format Go code
    deps:
      - install-golangci-lint
    cmds:
      - echo "Formatting Go code..."
      - '{{.GOLANGCI_LINT_BINARY}} fmt ./...'

  fmt-check:
    desc: Check Go source formatting without changing files
    deps:
      - install-golangci-lint
    cmds:
      - |
        set -eu
        output="$({{.GOLANGCI_LINT_BINARY}} fmt --diff ./...)"
        if [ -n "$output" ]; then
          printf '%s\n' "$output"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - echo "Running go vet..."
      - go vet ./...

  verify:
    desc: Run all checks without changing tracked files
    cmds:
      - task: deps
      - task: lint
      - task: yamllint
      - task: test
      - task: vuln
      - echo "All verification steps completed successfully"
